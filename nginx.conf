server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Todo lo que empiece por /api/ se reenvía al back (se quita el prefijo /api)
  location /api/ {
    proxy_pass http://peludos_api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Rutas de Angular: si el archivo no existe, devolver index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
